# ==========================================================
# lvyv-web (Nuxt 4 官网) 子配置文件 (HTTPS SSL 强重定向版)
# 适用于被 include 引入到 nginx.conf 的配置目录中 (如 conf.d)
# 域名: lvyv.com / www.lvyv.com
# ==========================================================

# ==========================================================
# 1. HTTP 流量强制 301 重定向到 HTTPS (支持 lvyv.com 和 www.lvyv.com)
# ==========================================================
server {
    listen 80;
    listen [::]:80;
    server_name lvyv.com www.lvyv.com;
    
    # 强制所有 HTTP 请求跳转到 https://www.lvyv.com
    return 301 https://www.lvyv.com$request_uri;
}


# ==========================================================
# 2. HTTPS lvyv.com (不带 www) 301 重定向到 https://www.lvyv.com (利于 SEO)
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lvyv.com;

    # SSL 证书配置 (重定向块也需要配置证书，否则浏览器会报证书不匹配错误)
    # 请确保您的证书是支持多域名 (lvyv.com 和 www.lvyv.com) 或者通配符证书
    ssl_certificate     /etc/nginx/cert/lvyv_web/lvyv.com.pem; # 您的证书 PEM/CRT 文件路径
    ssl_certificate_key /etc/nginx/cert/lvyv_web/lvyv.com.key; # 您的私钥 KEY 文件路径

    # 安全优化参数
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    return 301 https://www.lvyv.com$request_uri;
}


# ==========================================================
# 3. HTTPS www.lvyv.com 主站服务配置
# ==========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.lvyv.com;

    # ------------------------------------------------------
    # SSL 证书文件配置 (请在服务器建立 /etc/nginx/cert/ 目录并上传证书)
    # ------------------------------------------------------
    ssl_certificate     /etc/nginx/cert/lvyv_web/lvyv.com.pem; # 您的证书 PEM/CRT 文件路径
    ssl_certificate_key /etc/nginx/cert/lvyv_web/lvyv.com.key; # 您的私钥 KEY 文件路径

    # SSL 安全和性能优化参数
    ssl_session_cache shared:SSL:1m;
    ssl_session_timeout 5m;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4;
    ssl_protocols TLSv1.1 TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 在 server 级别开启 Gzip 压缩，保证当前站点的高性能
    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_vary on;

    # ------------------------------------------------------
    # 官网静态托管配置
    # ------------------------------------------------------
    location / {
        root   /usr/share/nginx/web;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        
        # 强制不缓存 index.html，保证前端发布后用户可以秒级获取最新版本
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # 针对 Nuxt 静态 resource (_nuxt) 的缓存优化
    location /_nuxt/ {
        root   /usr/share/nginx/web;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # 图片资源缓存 1 天
    location /images/ {
        root /usr/share/nginx/web;
        try_files $uri =404;

        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }


    # ------------------------------------------------------
    # 官网 API 接口代理 (转发给宿主机上映射的后端网关端口 8088)
    # ------------------------------------------------------
    location /web-api/ {
        proxy_pass http://47.109.99.83:8088; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/web;
    }
}
