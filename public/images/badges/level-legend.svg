<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    
    <!-- 共享金属与光泽渐变 -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#F5BA38"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    
    <!-- 顶级物理阴影滤镜 -->
    <filter id="badge-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050B14" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.7"/>
    </filter>
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="sun-burst" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </radialGradient>
    <linearGradient id="crown-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="50%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <g filter="url(#badge-drop-shadow)">
    <!-- 1. 十六道万丈放射烈日金芒底轮 -->
    <g fill="url(#gold-bevel)" opacity="0.95">
      <polygon points="64,2 69,20 59,20"/>
      <polygon points="64,126 69,108 59,108"/>
      <polygon points="2,64 20,69 20,59"/>
      <polygon points="126,64 108,69 108,59"/>
      <polygon points="20,20 36,32 30,38"/>
      <polygon points="108,108 92,96 98,90"/>
      <polygon points="20,108 36,96 30,90"/>
      <polygon points="108,20 92,32 98,38"/>
    </g>
    
    <!-- 2. 至尊日冕金盾盘 -->
    <circle cx="64" cy="64" r="50" fill="url(#gold-bevel)"/>
    <circle cx="64" cy="64" r="46" fill="#451A03"/>
    <circle cx="64" cy="64" r="43" fill="url(#sun-burst)"/>
    
    <!-- 3. 舒展的金乌凤羽双翼 (左右对称浮雕羽翼) -->
    <g fill="url(#gold-bevel)" filter="url(#inner-emboss)">
      <!-- 左翼 -->
      <path d="M22 52 C32 42 46 48 56 58 C48 62 38 64 24 60 Z"/>
      <path d="M26 62 C36 56 46 60 54 68 C46 71 38 72 28 68 Z"/>
      <path d="M32 71 C40 67 48 70 54 77 C48 79 42 79 34 76 Z"/>
      <!-- 右翼 -->
      <path d="M106 52 C96 42 82 48 72 58 C80 62 90 64 104 60 Z"/>
      <path d="M102 62 C92 56 82 60 74 68 C82 71 90 72 100 68 Z"/>
      <path d="M96 71 C88 67 80 70 74 77 C80 79 86 79 94 76 Z"/>
    </g>
    
    <!-- 4. 至尊传奇红宝石王冠 -->
    <g filter="url(#core-glow)">
      <polygon points="46,72 50,54 58,60 64,46 70,60 78,54 82,72" fill="url(#crown-gold)" stroke="#78350F" stroke-width="1.5"/>
      <!-- 王冠宝石镶嵌 -->
      <circle cx="64" cy="46" r="3.5" fill="#EF4444" stroke="#FFFFFF" stroke-width="0.8"/>
      <circle cx="50" cy="54" r="2.5" fill="#EF4444"/>
      <circle cx="78" cy="54" r="2.5" fill="#EF4444"/>
      <rect x="52" y="68" width="24" height="4" rx="2" fill="#EF4444"/>
    </g>
    
    <!-- 5. 顶端至尊日耀八角破晓之星 -->
    <g filter="url(#core-glow)">
      <polygon points="64,18 66.5,28 76.5,30 66.5,33 64,43 61.5,33 51.5,30 61.5,28" fill="#FFFFFF"/>
      <circle cx="64" cy="30.5" r="3" fill="#FEF08A"/>
    </g>
  </g>
</svg>