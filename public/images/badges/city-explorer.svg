<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    
    <!-- 共享金属与光泽渐变 -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#F5BA38"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    
    <!-- 顶级物理阴影滤镜 -->
    <filter id="badge-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050B14" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.7"/>
    </filter>
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="imperial-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="40%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <radialGradient id="city-sky" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#450A0A"/>
    </radialGradient>
  </defs>
  <g filter="url(#badge-drop-shadow)">
    <!-- 1. 皇家城印方圆金盾 -->
    <rect x="14" y="14" width="100" height="100" rx="26" fill="url(#gold-bevel)"/>
    <rect x="18" y="18" width="92" height="92" rx="22" fill="#450A0A"/>
    <rect x="22" y="22" width="84" height="84" rx="18" fill="url(#imperial-red)"/>
    <rect x="26" y="26" width="76" height="76" rx="14" fill="url(#city-sky)"/>
    
    <!-- 2. 古建重檐庑殿顶 (金色飞檐) -->
    <!-- 顶脊吻兽 -->
    <polygon points="64,36 67,42 61,42" fill="#FDE68A"/>
    <!-- 上层重檐 -->
    <path d="M38 48 C48 45 64 45 64 45 C64 45 80 45 90 48 L86 44 C76 42 64 42 64 42 C64 42 52 42 42 44 Z" fill="url(#gold-bevel)"/>
    <path d="M44 48 L84 48 L80 54 L48 54 Z" fill="#FEF2F2"/>
    <!-- 下层大飞檐 -->
    <path d="M28 58 C42 54 64 54 64 54 C64 54 86 54 100 58 L94 54 C82 51 64 51 64 51 C64 51 46 51 34 54 Z" fill="url(#gold-bevel)"/>
    
    <!-- 3. 城墙砖阙与立柱 -->
    <rect x="36" y="58" width="56" height="12" fill="#991B1B"/>
    <g fill="#FEF08A">
      <rect x="42" y="60" width="4" height="8"/>
      <rect x="52" y="60" width="4" height="8"/>
      <rect x="62" y="60" width="4" height="8"/>
      <rect x="72" y="60" width="4" height="8"/>
      <rect x="82" y="60" width="4" height="8"/>
    </g>
    <!-- 4. 巍峨城台与拱券城门 -->
    <path d="M32 70 L96 70 L98 98 L30 98 Z" fill="#7F1D1D" stroke="url(#gold-bevel)" stroke-width="1.5"/>
    <path d="M52 98 C52 82 76 82 76 98 Z" fill="#FDE047" filter="url(#core-glow)"/>
    <path d="M56 98 C56 86 72 86 72 98 Z" fill="#450A0A"/>
    
    <!-- 5. 顶悬探索寻踪指南针印 -->
    <circle cx="64" cy="30" r="5" fill="#FDE047" filter="url(#core-glow)"/>
    <polygon points="64,22 66,27 70,29 66,31 64,36 62,31 58,29 62,27" fill="#FFFFFF"/>
  </g>
</svg>