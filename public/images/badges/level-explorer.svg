<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    
    <!-- 共享金属与光泽渐变 -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#F5BA38"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    
    <!-- 顶级物理阴影滤镜 -->
    <filter id="badge-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050B14" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.7"/>
    </filter>
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="bronze-plate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="30%" stop-color="#0F766E"/>
      <stop offset="80%" stop-color="#115E59"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
  </defs>
  <g filter="url(#badge-drop-shadow)">
    <!-- 1. 经典古铜与青绿厚盾 -->
    <path d="M64 12 C96 12 114 22 114 48 C114 86 64 118 64 118 C64 118 14 86 14 48 C14 22 32 12 64 12 Z" fill="url(#gold-bevel)"/>
    <path d="M64 16 C92 16 108 26 108 50 C108 83 64 112 64 112 C64 112 20 83 20 50 C20 26 36 16 64 16 Z" fill="#042F2E"/>
    <path d="M64 20 C88 20 102 29 102 52 C102 80 64 106 64 106 C64 106 26 80 26 52 C26 29 40 20 64 20 Z" fill="url(#bronze-plate)"/>
    
    <!-- 2. 探险家四向十字准星刻纹 -->
    <circle cx="64" cy="58" r="26" fill="none" stroke="url(#gold-bevel)" stroke-width="2"/>
    <circle cx="64" cy="58" r="22" fill="#042F2E" opacity="0.6"/>
    <line x1="64" y1="28" x2="64" y2="88" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.7"/>
    <line x1="34" y1="58" x2="94" y2="58" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.7"/>
    
    <!-- 3. 中央高光探索星芒 -->
    <g filter="url(#core-glow)">
      <!-- 垂直峰 -->
      <polygon points="64,36 67,55 64,58 61,55" fill="#FFFBEB"/>
      <polygon points="64,80 67,61 64,58 61,61" fill="#D97706"/>
      <!-- 水平峰 -->
      <polygon points="86,58 67,61 64,58 67,55" fill="#FBBF24"/>
      <polygon points="42,58 61,61 64,58 61,55" fill="#FFFBEB"/>
      <!-- 斜峰 -->
      <polygon points="78,44 65,56 64,58 66,55" fill="#F59E0B"/>
      <polygon points="50,72 63,60 64,58 62,61" fill="#B45309"/>
      <polygon points="78,72 65,60 64,58 66,61" fill="#D97706"/>
      <polygon points="50,44 63,56 64,58 62,55" fill="#FDE68A"/>
    </g>
    <!-- 核心微晶与盾顶星辉 -->
    <circle cx="64" cy="58" r="4.5" fill="#14B8A6" stroke="#FEF3C7" stroke-width="1.5"/>
    <polygon points="64,22 66,26 70,27 66,28 64,32 62,28 58,27 62,26" fill="#FDE68A"/>
  </g>
</svg>