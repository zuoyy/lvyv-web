<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    
    <!-- 共享金属与光泽渐变 -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#F5BA38"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    
    <!-- 顶级物理阴影滤镜 -->
    <filter id="badge-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050B14" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.7"/>
    </filter>
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="bamboo-jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>
    <radialGradient id="mist-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="40%" stop-color="#A7F3D0"/>
      <stop offset="80%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#022C22"/>
    </radialGradient>
  </defs>
  <g filter="url(#badge-drop-shadow)">
    <!-- 1. 八角青铜与青玉厚重基座 -->
    <polygon points="40,10 88,10 118,40 118,88 88,118 40,118 10,88 10,40" fill="url(#gold-bevel)"/>
    <polygon points="42,14 86,14 114,42 114,86 86,114 42,114 14,86 14,42" fill="#022C22"/>
    <polygon points="44,18 84,18 110,44 110,84 84,110 44,110 18,84 18,44" fill="url(#bamboo-jade)"/>
    <polygon points="46,21 82,21 107,46 107,82 82,107 46,107 21,82 21,46" fill="url(#mist-bg)"/>
    
    <!-- 2. 金色明月 -->
    <circle cx="86" cy="42" r="13" fill="#FDE68A" filter="url(#core-glow)"/>
    <circle cx="89" cy="40" r="11" fill="url(#mist-bg)" opacity="0.3"/>
    
    <!-- 3. 层峦叠嶂的青山水墨微缩景观 -->
    <path d="M16 88 L46 48 L76 88 Z" fill="#064E3B" opacity="0.95"/>
    <path d="M48 88 L74 54 L100 88 Z" fill="#047857" opacity="0.9"/>
    <path d="M34 96 L62 62 L90 96 Z" fill="#059669"/>
    
    <!-- 4. 慢行扁舟 -->
    <ellipse cx="64" cy="94" rx="14" ry="3.5" fill="#78350F" stroke="#FEF3C7" stroke-width="1"/>
    <line x1="62" y1="87" x2="62" y2="94" stroke="#FEF3C7" stroke-width="1.5"/>
    <polygon points="62,88 70,91 62,94" fill="#FEF3C7"/>
    
    <!-- 5. 悠然祥云与慢飞归燕 -->
    <path d="M26 84 C36 80 44 80 52 84 C60 88 68 88 76 84 C84 80 94 84 102 88" fill="none" stroke="#D1FAE5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M42 42 Q46 38 50 41 Q54 38 58 42 Q50 44 42 42 Z" fill="#FFFFFF"/>
  </g>
</svg>