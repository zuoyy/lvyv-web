<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    
    <!-- 共享金属与光泽渐变 -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#F5BA38"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    
    <!-- 顶级物理阴影滤镜 -->
    <filter id="badge-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050B14" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.7"/>
    </filter>
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="violet-plate" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="40%" stop-color="#7C3AED"/>
      <stop offset="80%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </radialGradient>
  </defs>
  <g filter="url(#badge-drop-shadow)">
    <!-- 1. 紫宸华贵金丝盾徽 -->
    <path d="M64 10 C98 10 116 22 116 52 C116 88 64 120 64 120 C64 120 12 88 12 52 C12 22 30 10 64 10 Z" fill="url(#gold-bevel)"/>
    <path d="M64 15 C93 15 109 26 109 53 C109 84 64 113 64 113 C64 113 19 84 19 53 C19 26 35 15 64 15 Z" fill="#2E1065"/>
    <path d="M64 19 C89 19 103 29 103 54 C103 81 64 107 64 107 C64 107 25 81 25 54 C25 29 39 19 64 19 Z" fill="url(#violet-plate)"/>
    
    <!-- 2. 半展开的文墨黄金圣典卷轴 -->
    <rect x="36" y="42" width="56" height="42" rx="6" fill="#FEF3C7" stroke="url(#gold-bevel)" stroke-width="2.5" filter="url(#inner-emboss)"/>
    <!-- 卷轴文本横线浮雕 -->
    <line x1="44" y1="52" x2="76" y2="52" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="62" x2="84" y2="62" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="44" y1="72" x2="68" y2="72" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- 3. 斜跨的黄金羽毛笔 (羽翎金羽) -->
    <path d="M84 30 C76 42 70 56 64 68 L68 70 C74 58 82 46 92 34 Z" fill="url(#gold-bevel)"/>
    <polygon points="63,70 61,77 67,73" fill="#D97706"/>
    
    <!-- 4. 紫晶智慧吊坠与顶冠星芒 -->
    <circle cx="64" cy="28" r="6.5" fill="#E879F9" stroke="#FEF3C7" stroke-width="1.8" filter="url(#core-glow)"/>
    <polygon points="64,18 66,23 71,25 66,27 64,32 62,27 57,25 62,23" fill="#FFFFFF"/>
  </g>
</svg>