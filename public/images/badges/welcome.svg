<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    
    <!-- 共享金属与光泽渐变 -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#F5BA38"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    
    <!-- 顶级物理阴影滤镜 -->
    <filter id="badge-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050B14" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.7"/>
    </filter>
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <radialGradient id="w-plate" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="70%" stop-color="#022C22"/>
      <stop offset="100%" stop-color="#011510"/>
    </radialGradient>
    <linearGradient id="jade-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <g filter="url(#badge-drop-shadow)">
    <!-- 1. 金铸外环与十二齿刻花底托 -->
    <circle cx="64" cy="64" r="54" fill="url(#gold-bevel)"/>
    <circle cx="64" cy="64" r="51.5" fill="none" stroke="#78350F" stroke-width="1"/>
    <!-- 翡翠内环镶嵌 -->
    <circle cx="64" cy="64" r="48" fill="url(#jade-rim)"/>
    <circle cx="64" cy="64" r="45" fill="url(#gold-bevel)"/>
    <circle cx="64" cy="64" r="42" fill="url(#w-plate)"/>
    
    <!-- 2. 罗盘微刻度线与同心星轨 -->
    <circle cx="64" cy="64" r="38" fill="none" stroke="#FDE68A" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6"/>
    <circle cx="64" cy="64" r="32" fill="none" stroke="#34D399" stroke-width="0.6" opacity="0.5"/>
    <g stroke="#FDE68A" stroke-width="1.2" opacity="0.75">
      <line x1="64" y1="23" x2="64" y2="27"/>
      <line x1="64" y1="101" x2="64" y2="105"/>
      <line x1="23" y1="64" x2="27" y2="64"/>
      <line x1="101" y1="64" x2="105" y2="64"/>
    </g>
    
    <!-- 3. 中央立体八角罗盘星芒 -->
    <!-- 副星芒 (深金斜向) -->
    <polygon points="64,36 68,58 90,52 70,68 84,86 64,72 44,86 58,68 38,52 60,58" fill="#B45309" filter="url(#inner-emboss)"/>
    <!-- 主星芒 (高光立体切面) -->
    <g filter="url(#core-glow)">
      <!-- 上主峰 -->
      <polygon points="64,22 64,64 57,56" fill="#FDE68A"/>
      <polygon points="64,22 71,56 64,64" fill="#D97706"/>
      <!-- 下主峰 -->
      <polygon points="64,106 64,64 71,72" fill="#FDE68A"/>
      <polygon points="64,106 57,72 64,64" fill="#B45309"/>
      <!-- 右主峰 -->
      <polygon points="106,64 64,64 72,57" fill="#FDE68A"/>
      <polygon points="106,64 72,71 64,64" fill="#D97706"/>
      <!-- 左主峰 -->
      <polygon points="22,64 64,64 56,71" fill="#FEF3C7"/>
      <polygon points="22,64 56,57 64,64" fill="#B45309"/>
      <!-- 斜向切面光华 -->
      <polygon points="64,64 94,34 68,57" fill="#F59E0B"/>
      <polygon points="64,64 94,94 73,69" fill="#92400E"/>
      <polygon points="64,64 34,94 60,71" fill="#F59E0B"/>
      <polygon points="64,64 34,34 59,60" fill="#FEF3C7"/>
    </g>
    <!-- 4. 核心聚光晶石与祥云饰边 -->
    <circle cx="64" cy="64" r="7" fill="url(#gold-bevel)"/>
    <circle cx="64" cy="64" r="5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2"/>
    <circle cx="62" cy="62" r="1.5" fill="#FFFFFF"/>
    <!-- 左右如意金云纹 -->
    <path d="M42 98 C36 94 36 86 44 85 C45 80 52 79 56 83 C59 86 58 92 53 93 C56 94 57 98 52 100 C47 102 43 100 42 98 Z" fill="url(#gold-bevel)" stroke="#78350F" stroke-width="0.8"/>
    <path d="M86 98 C92 94 92 86 84 85 C83 80 76 79 72 83 C69 86 70 92 75 93 C72 94 71 98 76 100 C81 102 85 100 86 98 Z" fill="url(#gold-bevel)" stroke="#78350F" stroke-width="0.8"/>
  </g>
</svg>