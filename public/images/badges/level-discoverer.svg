<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    
    <!-- 共享金属与光泽渐变 -->
    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="25%" stop-color="#F5BA38"/>
      <stop offset="50%" stop-color="#D97706"/>
      <stop offset="75%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FDE68A"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#92400E"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    
    <!-- 顶级物理阴影滤镜 -->
    <filter id="badge-drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#050B14" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <filter id="inner-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.7"/>
    </filter>
    <filter id="core-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="silver-bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#CBD5E1"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <radialGradient id="sapphire-plate" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="40%" stop-color="#2563EB"/>
      <stop offset="80%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
  </defs>
  <g filter="url(#badge-drop-shadow)">
    <!-- 1. 秘银与深海蓝宝石高阶盾徽 -->
    <path d="M64 10 C98 10 116 22 116 52 C116 88 64 120 64 120 C64 120 12 88 12 52 C12 22 30 10 64 10 Z" fill="url(#silver-bevel)"/>
    <path d="M64 15 C93 15 109 26 109 53 C109 84 64 113 64 113 C64 113 19 84 19 53 C19 26 35 15 64 15 Z" fill="#0F172A"/>
    <path d="M64 19 C89 19 103 29 103 54 C103 81 64 107 64 107 C64 107 25 81 25 54 C25 29 39 19 64 19 Z" fill="url(#sapphire-plate)"/>
    
    <!-- 2. 八面体天工发光水晶棱镜 -->
    <polygon points="64,30 90,52 64,94 38,52" fill="#0F172A" stroke="url(#silver-bevel)" stroke-width="2"/>
    <!-- 棱镜折射各切面 -->
    <polygon points="64,30 90,52 64,62" fill="#93C5FD" opacity="0.9"/>
    <polygon points="64,30 38,52 64,62" fill="#DBEAFE" opacity="0.95"/>
    <polygon points="38,52 64,94 64,62" fill="#3B82F6" opacity="0.85"/>
    <polygon points="90,52 64,94 64,62" fill="#1D4ED8" opacity="0.8"/>
    
    <!-- 3. 水晶核心透光耀斑与环绕光环 -->
    <ellipse cx="64" cy="62" rx="20" ry="8" fill="none" stroke="#FFFFFF" stroke-width="1.2" transform="rotate(-15 64 62)" opacity="0.75"/>
    <circle cx="64" cy="60" r="7" fill="#FFFFFF" filter="url(#core-glow)"/>
    <!-- 发散极光芒 -->
    <polygon points="64,44 66.5,57 78,60 66.5,63 64,76 61.5,63 50,60 61.5,57" fill="#E0F2FE"/>
  </g>
</svg>